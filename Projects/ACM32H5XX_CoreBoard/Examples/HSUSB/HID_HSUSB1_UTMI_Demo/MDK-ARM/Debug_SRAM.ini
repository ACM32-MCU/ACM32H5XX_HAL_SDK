FUNC void OnResetExec (void) {
  SP = _RDWORD(0x20008000);             // 设置栈指针SP，把0x20010000地址中的内容赋值到SP。
  PC = _RDWORD(0x20008004);             // 设置程序指针PC，把0x20010004地址中的内容赋值到PC。
  _WDWORD(0xE000ED08, 0x00000000);      // Setup Vector Table Offset Register
}

OnResetExec();																 //调用上面定义的setup函数设置运行环境		

